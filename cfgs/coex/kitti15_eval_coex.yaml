DATA_CONFIG:
    DATA_INFOS:
        # -   DATASET: KittiDataset
        #     DATA_SPLIT: {
        #         EVALUATING: ./data/KITTI15//kitti15_train200.txt,
        #         TESTING: ./data/KITTI15//kitti15_test.txt
        #     }
        #     DATA_PATH: ./data/KITTI15/kitti15
        #     RETURN_RIGHT_DISP: false
        # -   DATASET: KittiDataset
        #     DATA_SPLIT: {
        #         TRAINING: '',
        #         EVALUATING: './data/KITTI12/kitti12_train194.txt',
        #         TESTING: ''
        #     }
        #     DATA_PATH: ./data/KITTI12/kitti12
        #     RETURN_RIGHT_DISP: false

        -   DATASET: MiddleburyDataset
            DATA_SPLIT: {
                EVALUATING: ./data/Middlebury/MiddEval3_train_h.txt,
            }
            DATA_PATH: /home/rispro-sils/ADAS_Kedaireka/Dataset/Middlebury/MiddEval3-data-H
            RETURN_RIGHT_DISP: false



    DATA_TRANSFORM:
        EVALUATING:
            - { NAME: RightTopPad, SIZE: [ 384, 1248 ], MODE: round }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }
        TESTING:
            - { NAME: DivisiblePad, BY: 32 }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }

MODEL:
    NAME: CoExNet
    MAX_DISP: &max_disp 192
    SPIXEL_BRANCH_CHANNELS: [ 32, 48 ]
    CHANS: [ 16, 24, 32, 96, 160 ]
    MATCHING_WEIGHTED: False
    MATCHING_HEAD: 1
    GCE: true
    AGGREGATION_DISP_STRIDES: 2
    AGGREGATION_CHANNELS: [ 16, 32, 48 ]
    AGGREGATION_BLOCKS_NUM: [ 2, 2, 2 ]
    REGRESSION_TOPK: 2
    FIND_UNUSED_PARAMETERS: true
    CKPT: -1
    PRETRAINED_MODEL: '/home/rispro-sils/ADAS_Kedaireka/Perception/OpenStereo/output/fix_ckpt/CoExNet_Sceneflow_Amp.pt'

OPTIMIZATION:
    BATCH_SIZE_PER_GPU: 8
    FREEZE_BN: false
    SYNC_BN: false
    AMP: true
    NUM_EPOCHS: 15

    OPTIMIZER:
        NAME: RMSprop
        LR: 0.001

    SCHEDULER:
        NAME: MultiStepLR
        GAMMA: 0.1
        MILESTONES: [ 9, 12 ]
        ON_EPOCH: True
        WARMUP:
            WARM_STEPS: 100

    CLIP_GRAD:
        TYPE: value
        CLIP_VALUE: 0.1

EVALUATOR:
    BATCH_SIZE_PER_GPU: 1
    MAX_DISP: *max_disp
    METRIC:
        - d1_all
        - epe
        - thres_1
        - thres_2
        - thres_3

TRAINER:
    EVAL_INTERVAL: 1
    CKPT_SAVE_INTERVAL: 1
    MAX_CKPT_SAVE_NUM: 30
    LOGGER_ITER_INTERVAL: 10
    TRAIN_VISUALIZATION: True
    EVAL_VISUALIZATION: True
