DATA_CONFIG:
    DATA_INFOS:
        -   DATASET: KittiDataset
            DATA_SPLIT: {
                EVALUATING: ./data/KITTI12/kitti12_train194.txt,
                TESTING: ./data/KITTI12/kitti12_test.txt
            }
            DATA_PATH: ./data/KITTI12/kitti12
            RETURN_RIGHT_DISP: false
        # -   DATASET: KittiDataset
        #     DATA_SPLIT: {
        #         EVALUATING: ./data/KITTI15//kitti15_train200.txt,
        #         TESTING: ./data/KITTI15//kitti15_test.txt
        #     }
        #     DATA_PATH: ./data/KITTI15/kitti15
        #     RETURN_RIGHT_DISP: false


    DATA_TRANSFORM:
        EVALUATING:
            - { NAME: RightTopPad, SIZE: [ 384, 1248 ]}
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }

        TESTING:
            - { NAME: DivisiblePad, BY: 32 }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }


EVALUATOR:
    BATCH_SIZE_PER_GPU: 1
    MAX_DISP: 192
    METRIC:
        - d1_all
        - epe
        - thres_1
        - thres_2
        - thres_3

MODEL:
    NAME: LightStereo4
    MAX_DISP: 192
    EXPANSE_RATIO: 4
    AGGREGATION_BLOCKS: [ 1, 2, 4 ]
    LEFT_ATT: true
    FIND_UNUSED_PARAMETERS: false
    CKPT: -1
    PRETRAINED_MODEL: '/home/rispro-sils/ADAS_Kedaireka/Perception/OpenStereo/output/fix_ckpt/checkpoint_epoch_499_efsnet_kitti_general.pth'
    

OPTIMIZATION:
    FREEZE_BN: false
    SYNC_BN: true
    AMP: true
    BATCH_SIZE_PER_GPU: 2
    NUM_EPOCHS: 500

    OPTIMIZER:
        NAME: AdamW
        LR: &lr 0.0002
        WEIGHT_DECAY: 1.0e-05
        EPS: 1.0e-08

    SCHEDULER:
        NAME: OneCycleLR
        MAX_LR: *lr
        PCT_START: 0.01
        ON_EPOCH: False

    CLIP_GRAD:
        TYPE: value
        CLIP_VALUE: 0.1